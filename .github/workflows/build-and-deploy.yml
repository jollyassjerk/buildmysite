name: Build and Deploy

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        env:
          NOMINATIM_USER_AGENT: buildmysite/1.0 (${{ github.repository }})
        run: node scripts/build.mjs

      - name: Commit geocode cache if changed
        run: |
          if git diff --quiet data/geocode-cache.json; then
            echo "Geocode cache unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/geocode-cache.json
            git commit -m "chore: update geocode cache [skip ci]"
            git push
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          cp index.html explore.html view.html _site/
          cp -r assets _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
